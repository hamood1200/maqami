<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="مقامي — تعلّم المقامات العربية وأجناسها على الأورغ الشرقي، مع أمثلة غنائية واختبارات للأذن." />
    <meta name="theme-color" content="#1a1410" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // يُحدَّد الوضع قبل الرسم لتجنّب وميض الألوان: اختيار المستخدم أولاً، ثم إعداد النظام
      ;(function () {
        var s = null
        try { s = localStorage.getItem('maqami-theme') } catch (e) {}
        var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>مقامي — تعلّم المقامات على الأورغ الشرقي</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
